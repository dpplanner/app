<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="동아리·클럽 관리 서비스 DPlanner">

  <!-- Google Sign-In (web) 클라이언트 ID -->
  <meta name="google-signin-client_id" content="547095373091-d663tdou7mhivsltgtfoesrti7j98knl.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="dplanner">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DPlanner</title>
  <link rel="manifest" href="manifest.json">

  <!-- 웹 로딩 스플래시 (폰트/엔진 로드 전 깜빡임 가리기) -->
  <style>
    #splash {
      position: fixed;
      inset: 0;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #splash .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #E5DFFB;
      border-top-color: #7646D8;
      border-radius: 50%;
      animation: dp-spin 0.8s linear infinite;
    }
    #splash .title {
      margin-top: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 20px;
      color: #7646D8;
      letter-spacing: -0.2px;
    }
    @keyframes dp-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="splash">
    <div class="spinner"></div>
    <div class="title">DPlanner</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Flutter 첫 프레임이 그려지면 스플래시 페이드아웃 후 제거.
    // 단, 새로고침으로 딥 화면 재진입(dpWasDeepLink)한 경우엔 자동로그인+딥 화면
    // 렌더(폰트 FOUT)까지 가리도록 잠깐 더 유지한다. 일반 로딩은 즉시 제거.
    window.addEventListener('flutter-first-frame', function () {
      var removeSplash = function () {
        var s = document.getElementById('splash');
        if (s) {
          s.style.opacity = '0';
          setTimeout(function () { s.remove(); }, 300);
        }
      };
      setTimeout(removeSplash, window.dpWasDeepLink ? 1500 : 0);
    });
  </script>
</body>
</html>
